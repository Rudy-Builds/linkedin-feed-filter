<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Feed Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="app">
    <header class="top">
      <div>
        <h1>Feed Filter</h1>
        <p class="tagline">Keep LinkedIn for the people, not the algorithm.</p>
      </div>
      <label class="switch" title="Turn the filter on or off">
        <input type="checkbox" id="enabled" role="switch" aria-label="Filter on or off">
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <p class="status" id="status" aria-live="polite"></p>

    <div id="controls">
      <section class="card">
        <h2>Videos</h2>
        <div class="seg" role="radiogroup" aria-label="Videos">
          <label><input type="radio" name="video" value="show"><span>Show</span></label>
          <label><input type="radio" name="video" value="text"><span>Text only</span></label>
          <label><input type="radio" name="video" value="hide"><span>Hide post</span></label>
        </div>
      </section>

      <section class="card">
        <h2>Pictures &amp; documents</h2>
        <div class="seg" role="radiogroup" aria-label="Pictures and documents">
          <label><input type="radio" name="image" value="show"><span>Show</span></label>
          <label><input type="radio" name="image" value="text"><span>Text only</span></label>
          <label><input type="radio" name="image" value="hide"><span>Hide post</span></label>
        </div>
        <p class="hint">
          <strong>Text only</strong> keeps the post's words and tucks the media behind a
          &ldquo;Show&rdquo; button. <strong>Hide post</strong> removes the whole post.
        </p>
      </section>

      <section class="card">
        <h2>Hide these posts</h2>
        <label class="row">
          <span>
            <strong>Promoted</strong>
            <small>Ads and sponsored posts</small>
          </span>
          <span class="switch">
            <input type="checkbox" id="promoted" role="switch">
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
        <label class="row">
          <span>
            <strong>Suggested</strong>
            <small>&ldquo;Suggested for you&rdquo; posts</small>
          </span>
          <span class="switch">
            <input type="checkbox" id="suggested" role="switch">
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
        <label class="row">
          <span>
            <strong>Connection activity</strong>
            <small>&ldquo;Someone likes / commented on this&rdquo;</small>
          </span>
          <span class="switch">
            <input type="checkbox" id="activity" role="switch">
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
      </section>

      <section class="card">
        <h2>Posts to show</h2>
        <div class="limit">
          <button type="button" id="less" aria-label="Fewer posts">&minus;</button>
          <input type="number" id="limit" min="0" max="500" step="1" inputmode="numeric" aria-label="Number of posts to show">
          <button type="button" id="more" aria-label="More posts">+</button>
        </div>
        <p class="hint" id="limit-hint"></p>
      </section>
    </div>

    <footer>
      <button type="button" id="reset" class="link">Reset to defaults</button>
      <span class="saved" id="saved" aria-live="polite"></span>
    </footer>
  </main>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
